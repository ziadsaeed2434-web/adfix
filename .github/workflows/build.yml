name: Build Tweak

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make clang

      - name: Setup Theos & Fix Toolchain Path
        run: |
          rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks

          # خدعة ربط مترجم النظام بالمكان الذي تبحث عنه Theos لحل خطأ 127 نهائياً
          mkdir -p ~/theos/toolchain/linux/iphone/bin
          ln -s /usr/bin/clang ~/theos/toolchain/linux/iphone/bin/clang
          ln -s /usr/bin/clang++ ~/theos/toolchain/linux/iphone/bin/clang++

          echo "THEOS=/home/runner/theos" >> $GITHUB_ENV
          echo "/home/runner/theos/bin" >> $GITHUB_PATH

      - name: Compile Tweak
        run: |
          export PATH=/home/runner/theos/bin:$PATH
          make

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdFixerPro-Dylib
          path: .theos/obj/AdFixerPro.dylib
