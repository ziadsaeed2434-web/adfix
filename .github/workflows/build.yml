name: Build Tweak

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make clang

      - name: Setup Theos & Environment
        run: |
          # تنظيف أي بقايا قديمة
          rm -rf ~/theos
          # سحب Theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          # سحب SDKs
          git clone https://github.com/theos/sdks.git ~/theos/sdks
          # تصدير المسارات
          echo "THEOS=/home/runner/theos" >> $GITHUB_ENV
          echo "/home/runner/theos/bin" >> $GITHUB_PATH

      - name: Compile Tweak
        run: |
          # استخدام المترجم المدمج في النظام بدلاً من البحث عن مسارات مفقودة
          make CC=clang CXX=clang++

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdFixerPro-Dylib
          path: .theos/obj/debug/AdFixerPro.dylib
