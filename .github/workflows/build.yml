name: Build Tweak

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make clang

      - name: Setup Environment
        run: |
          # نستخدم مجلد داخل مسار العمل الحالي للمشروع لضمان أنه ليس محمياً
          export THEOS=$GITHUB_WORKSPACE/theos_env
          git clone --recursive https://github.com/theos/theos.git $THEOS
          git clone https://github.com/theos/sdks.git $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Compile Tweak
        run: |
          # استخدام المتغير المعرف في الخطوة السابقة
          make CC=clang CXX=clang++ THEOS=$GITHUB_WORKSPACE/theos_env

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdFixerPro-Dylib
          path: .theos/obj/debug/AdFixerPro.dylib
