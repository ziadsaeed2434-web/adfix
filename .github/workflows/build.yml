name: Build iOS Tweak dylib

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-13  # استخدام macos-13 أسرع بكثير في الإقلاع وأرخص في استهلاك الدقائق من أحدث إصدار

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install ldid
      run: |
        brew install ldid

    - name: Cache Theos and SDKs
      id: cache-theos
      uses: actions/cache@v3
      with:
        path: ~/theos
        key: ${{ runner.os }}-theos-v2

    - name: Setup Theos
      if: steps.cache-theos.outputs.cache-hit != 'true'
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks

    - name: Build Tweak
      run: |
        export THEOS=~/theos
        make clean
        make
      env:
        THEOS: /Users/runner/theos

    - name: List built files
      run: find .theos -name "*.dylib"

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AdPurgeTweak-dylib
        path: .theos/obj/**/*.dylib
