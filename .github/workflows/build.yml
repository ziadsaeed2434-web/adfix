name: Build Tweak

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make clang

      - name: Setup Theos & SDKs
        run: |
          # تنظيف أي مسار قديم
          rm -rf ~/theos
          
          # تثبيت أدوات Theos بدون سحب الـ submodules التلقائية التي تسبب المشاكل
          git clone --no-recursive https://github.com/theos/theos.git ~/theos
          
          # حذف مجلد الـ sdks الفارغ لو وجد، ثم سحب الـ SDKs الحقيقية بشكل نظيف
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks

          echo "THEOS=/home/runner/theos" >> $GITHUB_ENV
          echo "/home/runner/theos/bin" >> $GITHUB_PATH

      - name: Compile Tweak
        run: |
          export PATH=/home/runner/theos/bin:$PATH
          make

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdFixerPro-Dylib
          path: .theos/obj/AdFixerPro.dylib
