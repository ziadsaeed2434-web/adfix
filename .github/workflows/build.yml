name: Build Tweak

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make curl unzip

      - name: Setup Theos in Temp Directory
        run: |
          # مسح وتجهيز مسار جديد كلياً في الـ tmp لتجنب أي مشاكل تخزين مؤقت
          rm -rf /tmp/theos
          mkdir -p /tmp/theos

          git clone --recursive https://github.com/theos/theos.git /tmp/theos
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos/sdks
          git clone --depth=1 https://github.com/theos/toolchain-linux.git /tmp/theos/toolchain/linux/iphone

          echo "THEOS=/tmp/theos" >> $GITHUB_ENV
          echo "/tmp/theos/bin" >> $GITHUB_PATH

      - name: Compile Tweak
        run: |
          export PATH=/tmp/theos/bin:$PATH
          make

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdFixerPro-Dylib
          path: .theos/obj/AdFixerPro.dylib
