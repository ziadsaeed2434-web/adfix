name: Build Tweak

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make clang

      - name: Setup Environment
        run: |
          # استخدام مجلد جديد كلياً لتجنب تعارض الملفات الموجودة مسبقاً
          export THEOS_ROOT=$HOME/my_theos
          git clone --recursive https://github.com/theos/theos.git $THEOS_ROOT
          git clone https://github.com/theos/sdks.git $THEOS_ROOT/sdks
          echo "THEOS=$THEOS_ROOT" >> $GITHUB_ENV
          echo "$THEOS_ROOT/bin" >> $GITHUB_PATH

      - name: Compile Tweak
        run: |
          # استخدام المترجم المدمج مباشرة لضمان عدم وجود أخطاء مسارات
          make CC=clang CXX=clang++

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdFixerPro-Dylib
          path: .theos/obj/debug/AdFixerPro.dylib
