name: Build Tweak

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make clang curl unzip

      - name: Setup Theos & SDK
        run: |
          # حذف أي مسار قديم تماماً
          rm -rf ~/theos
          
          # تثبيت الـ Theos الأساسي بدون الـ sdks التلقائية لتجنب التعارض
          git clone https://github.com/theos/theos.git ~/theos
          
          # إنشاء مجلد الـ sdks وجلب أحدث ملف خفيف مباشرة
          mkdir -p ~/theos/sdks
          curl -L -o ~/theos/sdks/sdk.zip https://github.com/theos/sdks/releases/download/latest/iPhoneOS14.5.sdk.zip
          unzip -q ~/theos/sdks/sdk.zip -d ~/theos/sdks/
          rm ~/theos/sdks/sdk.zip

          echo "THEOS=/home/runner/theos" >> $GITHUB_ENV
          echo "/home/runner/theos/bin" >> $GITHUB_PATH

      - name: Compile Tweak
        run: |
          export PATH=/home/runner/theos/bin:$PATH
          make

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdFixerPro-Dylib
          path: .theos/obj/AdFixerPro.dylib
