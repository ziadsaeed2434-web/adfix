name: Build Tweak

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make curl unzip

      - name: Setup Theos & Toolchain safely
        run: |
          # تنظيف كامل للمجلدات القديمة
          rm -rf /tmp/theos
          mkdir -p /tmp/theos

          # استنساخ ثيوس الأساسي
          git clone --recursive https://github.com/theos/theos.git /tmp/theos

          # التحقق من عدم وجود الـ sdks مسبقاً قبل استنساخها لتجنب الخطأ تماماً
          if [ ! -d "/tmp/theos/sdks" ]; then
            git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos/sdks
          fi

          # التحقق من الـ toolchain قبل استنساخه
          if [ ! -d "/tmp/theos/toolchain/linux/iphone" ]; then
            git clone --depth=1 https://github.com/theos/toolchain-linux.git /tmp/theos/toolchain/linux/iphone
          fi

          echo "THEOS=/tmp/theos" >> $GITHUB_ENV
          echo "/tmp/theos/bin" >> $GITHUB_PATH

      - name: Compile Tweak
        run: |
          export PATH=/tmp/theos/bin:$PATH
          make

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdFixerPro-Dylib
          path: .theos/obj/AdFixerPro.dylib
